; ---------------------------------------------------------------------------
; Online backend: Steam, through the SteamCore PRO plugin.
;
; The session code (UVoxelSessionSubsystem) is written against IOnlineSession
; and never names a backend, so this block is the whole switch. Null is still
; ENABLED as a plugin - it is the fallback when the Steam client is not running,
; and the only way to test host/join on a machine with no Steam - but SteamCore
; is the default service, so a normal run goes over Steam.
;
; App id 5041030 is CUBICIOUS's own. Both keys must carry it and must agree:
; SteamAppId is what the shipped game identifies as, SteamDevAppId is what a
; build run outside the Steam client falls back to. A mismatch shows up as the
; subsystem initialising against one app and matchmaking against another, so
; two players see empty lobby lists with no error anywhere.
;
; Lobbies are keyed by app id, so a build on this id can no longer see the
; app-480 test lobbies, and vice versa. Both machines must be on this id.
;
; bRelaunchInSteam=False means launching the executable directly does NOT
; bounce through the Steam client. That is what allows local testing. For a
; released build most projects turn it on so the game always runs under Steam.
; ---------------------------------------------------------------------------
[OnlineSubsystemSteamCore]
bEnabled=True
SteamDevAppId=5041030
SteamAppId=5041030
bVACEnabled=True
bUseSteamNetworking=True
bAllowP2PPacketRelay=True
bRelaunchInSteam=False
bDisableSteamRelaunchInShipping=False
P2PConnectionTimeout=90
GameServerQueryPort=27015
GameVersion=1.0.0.0

[OnlineSubsystem]
DefaultPlatformService=SteamCore
bHasVoiceEnabled=true

[OnlineSubsystemNull]
bEnabled=true

[Voice]
bEnabled=true

[/Script/Engine.GameSession]
bRequiresPushToTalk=true

; SteamCore's own net driver carries traffic over Steam's P2P relay, so players
; join without port forwarding and without ever seeing an IP. IpNetDriver stays
; as the fallback: it is what a direct "VoxelConnect <ip>" and any Null/LAN
; session use, and what runs when the Steam client is absent.
;
; ClearArray first, because the engine's own GameNetDriver definition would
; otherwise still be in the array ahead of this one.
[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SteamCoreSockets.SteamCoreSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")


[SystemSettings]
; A voxel chunk rendered as flat grey for the first frame after it was first shot - once per object,
; sub-millisecond, and impossible to reproduce afterwards.
;
; Damage builds a NEW static mesh and, the first time a given chunk is hit, a NEW component to draw it
; (UVoxelComponent.cpp: RuntimeOverrideVisualComponents.FindOrAdd). A new primitive means a new render
; proxy, and until its pipeline state is compiled the renderer either delays drawing it or substitutes
; the DEFAULT MATERIAL - which is the grey.
;
; 0 = always create the proxy, even while PSOs are still compiling. The cost is a possible hitch on that
; first draw instead of a frame of the wrong material, which for a shot landing on a wall is the better
; trade: a dropped frame is invisible, a grey flash is not.
;
; ECVF_ReadOnly, so it can only be set here - it cannot be changed from the console at runtime.
r.PSOPrecache.ProxyCreationStrategy=0
