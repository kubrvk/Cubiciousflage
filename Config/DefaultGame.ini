[/Script/UnrealEd.ProjectPackagingSettings]
; ---------------------------------------------------------------------------
; What gets cooked.
;
; An EMPTY MapsToCook does not mean "cook the maps the game uses" - it means
; cook every map under /Game. That swept in Content/City, an art pack with 25
; maps, 3212 assets and 395 materials, none of which the game loads: the cook
; compiled shaders for all of them and packaged 28 GB nobody would ever see.
;
; So the ten maps the game can actually open are listed by hand. This list is
; load-bearing: a map missing from it is not in the packaged build, and the
; failure is a crash on travel rather than a cook error. Add to it when a new
; map is added.
+MapsToCook=(FilePath="/Game/Voxel_Lobby")
+MapsToCook=(FilePath="/Game/Cube/Map/Map_0_Custom")
+MapsToCook=(FilePath="/Game/Cube/Map/Map_1_City")
+MapsToCook=(FilePath="/Game/Cube/Map/Map_2_Woodlands")
+MapsToCook=(FilePath="/Game/Cube/Map/Map_3_Junkyard")
+MapsToCook=(FilePath="/Game/Cube/Map/Map_4_AlienWorld")
+MapsToCook=(FilePath="/Game/Cube/Map/Map_5_Factory")
+MapsToCook=(FilePath="/Game/Cube/Map/Map_6_Bazaar")
+MapsToCook=(FilePath="/Game/Cube/Map/Map_7_Frozen")
+MapsToCook=(FilePath="/Game/Cube/Map/Map_8_Sea")

; Belt and braces on the same problem. These are source art packs, read only by
; the editor-only bulk converter - /Game/City/Assets is the default argument of
; VoxelConvertFolder and VoxelConvertPlan - and turned into voxel object
; definitions under /Game/Cube/VoxelObjects, which is what actually ships.
; Nothing in the runtime module references them by hard pointer or by string.
;
; The entries stay even while the folders are moved out of the project, so that
; moving one back for a conversion pass does not silently re-enter the cook.
;
; /Game/VoxelDemo is deliberately NOT here. It looks like a plugin demo folder
; and is not one: Map_2 through Map_8 place VA_Building_07_Part_01,
; VA_SideWalk_01, VA_Rock_04 and VA_Tree_03 out of it. Excluding it fails the
; cook outright with "Content is missing from cook".
+DirectoriesToNeverCook=(Path="/Game/City")
+DirectoriesToNeverCook=(Path="/Game/RealCitySF")
+DirectoriesToNeverCook=(Path="/Game/Elite_FractalAlien")

; The base maps' thumbnail screenshots, carried into the packaged build as loose files.
;
; They cannot live in Saved/LevelThumbnails like captured ones do: Saved is per-installation and
; starts empty next to a packaged executable, so an editor capture is not there when the game runs -
; which is exactly why all eight base maps drew as "BASE" placeholders in the first packaged build.
;
; NonUFS rather than cooked assets because these are read with FImageUtils::ImportFileAsTexture2D
; from a real file path, not loaded as UObjects. Staging them keeps that one code path working in
; both the editor and the packaged game - see ResolveLevelThumbnailFile in SVoxelMainMenu.cpp.
;
; THE PATH IS RELATIVE TO Content/, not to the project root. A folder anywhere else is reported as
; "Unable to find directory ... for staging" in the packaging log and the build succeeds without it,
; so the only symptom is the thumbnails still being missing.
+DirectoriesToAlwaysStageAsNonUFS=(Path="BaseLevelThumbnails")

; The eight base maps' level assets are found BY NAME (/Game/Cube/Levels/Level_<MapName>) when a
; director has no Baked Level pointer set - see AVoxelLevelDirector::FindLevelAssetForThisMap. A
; by-name load is not a hard reference, so nothing in the cook would otherwise pull these in and a
; packaged build would run the base maps empty while the editor ran them dressed: the worst kind of
; split, because it only appears after packaging.
;
; Setting Baked Level explicitly still works and is still a hard reference. This is what makes NOT
; setting it safe.
+DirectoriesToAlwaysCook=(Path="/Game/Cube/Levels")

; The shared Slate style loads project font assets by path at runtime so every code-authored UI can
; use the same imported pixel fonts without carrying hard UObject references in every widget.
; Code string loads are not enough to pull assets into a packaged build, so cook the folder.
+DirectoriesToAlwaysCook=(Path="/Game/Cube/UI/Font")

; Player hit glow materials are generated by the editor module and referenced from runtime C++.
+DirectoriesToAlwaysCook=(Path="/Game/Cube/Materials")
